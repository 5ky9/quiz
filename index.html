<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Экзаменационные тесты</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg"></div>
  <div class="app">

    <section id="homeScreen" class="screen active">
      <div class="home">
        <div class="brand">
          <div class="brand-badge">100</div>
          <div>
            <h1>Экзаменационные тесты</h1>
            <p>Сети · Архитектура · ОС · Ассемблер</p>
          </div>
        </div>
        <div class="menu" id="menu"></div>
        <div class="tools">
          <button class="tool-btn" id="flashBtn"><span class="menu-icon">🃏</span><span class="menu-text"><strong>Флэш-карточки</strong><small id="flashSub"></small></span></button>
          <button class="tool-btn" id="statsBtn"><span class="menu-icon">📊</span><span class="menu-text"><strong>Статистика</strong><small id="statsSub"></small></span></button>
        </div>
        <label class="toggle">
          <input type="checkbox" id="shuffleQ">
          <span class="sw"></span>
          <span>Перемешивать вопросы</span>
        </label>
      </div>
    </section>

    <section id="quizScreen" class="screen">
      <header class="quiz-header">
        <button class="icon-btn" id="backBtn" aria-label="Назад">←</button>
        <div class="quiz-title">
          <strong id="quizTitle">Тест</strong>
          <span id="quizProgress"></span>
        </div>
        <div class="score-chip" id="scoreChip">0 / 0</div>
      </header>
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
      <div class="numbers" id="numbers"></div>
      <main class="question-card" id="card">
        <span class="topic-tag" id="topicTag"></span>
        <h2 id="questionText"></h2>
        <div class="options" id="options"></div>
        <div class="timer" id="timer"><i></i></div>
        <div class="nav">
          <button id="prevBtn" type="button">← Назад</button>
          <button id="nextBtn" type="button">Далее →</button>
        </div>
      </main>
    </section>

    <section id="resultScreen" class="screen">
      <div class="result-card">
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-bg" cx="60" cy="60" r="52"/>
            <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52"/>
          </svg>
          <div class="ring-text" id="resultIcon">🎉</div>
        </div>
        <h2 id="resultTitle">Тест завершён</h2>
        <p class="result-score" id="resultScore"></p>
        <p class="result-text" id="resultText"></p>
        <button class="primary-btn" id="mistakesResultBtn">🎯 Работа над ошибками</button>
        <button class="secondary-btn" id="retryBtn">Пройти заново</button>
        <button class="secondary-btn" id="homeBtn">На главный экран</button>
      </div>
    </section>
    <section id="statsScreen" class="screen">
      <header class="quiz-header">
        <button class="icon-btn" data-home aria-label="Назад">←</button>
        <div class="quiz-title"><strong>Статистика</strong><span>Твой прогресс</span></div>
      </header>
      <div class="panel" id="statsBody"></div>
    </section>

    <section id="flashScreen" class="screen">
      <header class="quiz-header">
        <button class="icon-btn" data-home aria-label="Назад">←</button>
        <div class="quiz-title"><strong>Флэш-карточки</strong><span id="flashInfo"></span></div>
        <div class="score-chip" id="flashChip">0 / 0</div>
      </header>
      <div class="progress"><div class="progress-bar" id="flashBar"></div></div>
      <div class="chips" id="flashChips"></div>
      <main class="flash-wrap">
        <div class="flip" id="flip">
          <div class="flip-inner" id="flipInner">
            <div class="face front"><span class="face-label">Вопрос</span><p id="flashQ"></p><small>Нажми, чтобы увидеть ответ</small></div>
            <div class="face back"><span class="face-label">Ответ</span><p id="flashA"></p></div>
          </div>
        </div>
        <div class="flash-actions" id="flashActions">
          <button class="again" id="againBtn">↻ Повторить</button>
          <button class="know" id="knowBtn">✓ Знаю</button>
        </div>
        <div class="flash-done" id="flashDone" hidden>
          <div class="big">🎉</div>
          <p id="flashDoneText"></p>
          <button class="secondary-btn" id="flashReset">Сбросить колоду</button>
        </div>
      </main>
    </section>

  </div>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
